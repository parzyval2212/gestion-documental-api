services:
  hproxy:
    image: haproxy:2.9
    container_name: hproxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
      - "8405:8405"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - publico

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - publico

volumes:
  grafana_data:

networks:
  publico:
    driver: bridge
